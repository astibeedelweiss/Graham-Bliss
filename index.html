<!DOCTYPE html>
<html>
<head>

<body>

<!-- FLOATING HEARTS -->
<div class="hearts">

<section class="menu">

  <div class="flavor-grid">
    <div class="flavor"><img src="classic.jpg"><p>Classic</p></div>
    <div class="flavor"><img src="milky.jpg"><p>Milky</p></div>
    <div class="flavor"><img src="chocolate.jpg"><p>Chocolate</p></div>
    <div class="flavor"><img src="ube.jpg"><p>Ube</p></div>

<!-- POPUP -->
<div id="order-popup">

    <h3>.𖥔 ݁ ˖ִChoose Your Sweet Box༄˖°.</h3>

    <select id="payment">
      <option value="">Select Payment</option>
      <option>Cash on Delivery</option>
      <option>GCash</option>
    </select>

    <button id="confirm-btn" onclick="confirmOrder()" disabled>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
